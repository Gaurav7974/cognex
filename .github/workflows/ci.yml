name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -v --tb=short -k "not mcp_server" tests/unit/ tests/integration/mcp/test_mcp_tool_registry.py tests/integration/mcp/test_mcp_core_tools.py tests/integration/mcp/test_mcp_memory_tools.py tests/integration/mcp/test_mcp_trust_tools.py tests/integration/mcp/test_mcp_ledger_tools.py

      - name: Verify imports
        run: |
          python -c "from cognex import CognexEngine"
          python -c "from cognex.units import StateUnitStore"
          python -c "from cognex_mcp.tools import list_all_tools"
